on:
  workflow_dispatch:
    inputs:
      DISTRO:
        description: 'Linux Distro for Build image'
        required: true
        default: 'trixie'
      GMSSL_VERSION:
        description: 'GMSSL Version'
        required: true
        default: '3.1.1'

name: Checkout and Create Release Version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCRHUB_USERNAME }}
          password: ${{ secrets.GHCRHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          build-args: |
            GMSSL_VERSION=${{ github.event.inputs.GMSSL_VERSION }}
          tags: |
            jumpserver/gmssl:${{ github.event.inputs.GMSSL_VERSION }}-${{ github.event.inputs.DISTRO }}
            ghcr.io/jumpserver/gmssl:${{ github.event.inputs.GMSSL_VERSION }}-${{ github.event.inputs.DISTRO }}
